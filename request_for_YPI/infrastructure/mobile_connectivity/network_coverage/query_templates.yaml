# ============================================================================
# Query Configuration - Network Coverage
# Pillar: Infrastructure / Mobile Connectivity / Network Coverage
# ============================================================================

queries:
  "1.cypher":
    description: "Network operator ecosystem health — active vs dormant ASes"
    
    template: |
      Title: Network Operator Ecosystem Health in {{ params.countryCode | upper }}
      
      This analysis breaks down the country's Autonomous Systems into active operators (those announcing BGP routes) and dormant registrations (ASes with no active routing). The active-to-total ratio is a direct measure of ecosystem vitality — countries with many registered but inactive ASes have underutilized network capacity.
      
      {% if results %}
      **Operator Ecosystem Overview:**
      
      - Country: **{{ results[0].Country }}**
      - Total Registered ASes: **{{ results[0].TotalASes }}**
      - Active Operators (BGP): **{{ results[0].ActiveASes }}** ({{ results[0].ActivePercent }}%)
      - Dormant Registrations: **{{ results[0].DormantASes }}**
      
      **Interpretation:**
      
      **{{ results[0].ActiveASes }}** out of **{{ results[0].TotalASes }}** registered ASes are actively originating BGP routes ({{ results[0].ActivePercent }}%). A higher active percentage indicates a healthier, more competitive network ecosystem. Dormant ASes may represent unused allocations, acquired-but-undeployed resources, or legacy registrations.
      
      {% else %}
      No network operator data available for this country.
      {% endif %}
    
    fields:
      Country:
        type: "string"
        label: "Country Name"
      TotalASes:
        type: "integer"
        label: "Total Registered ASes"
      ActiveASes:
        type: "integer"
        label: "Active Operators"
      DormantASes:
        type: "integer"
        label: "Dormant ASes"
      ActivePercent:
        type: "float"
        label: "Active Percentage"

  "2.cypher":
    description: "Physical infrastructure footprint — domestic vs international facility presence"
    
    template: |
      Title: Physical Infrastructure Footprint in {{ params.countryCode | upper }}
      
      This analysis counts the physical data center facilities where the country's ASes are colocated, separating domestic facilities (within the country) from international ones (abroad). Domestic facility count measures local infrastructure depth; international presence shows global connectivity reach.
      
      {% if results %}
      **Infrastructure Footprint:**
      
      - Country: **{{ results[0].Country }}**
      - Domestic Facilities: **{{ results[0].DomesticFacilities }}**
      - International Facilities: **{{ results[0].InternationalFacilities }}**
      - Total Facilities: **{{ results[0].TotalFacilities }}**
      
      **Interpretation:**
      
      **{{ results[0].DomesticFacilities }}** facilities are located within the country, while **{{ results[0].InternationalFacilities }}** are abroad. A strong domestic facility base is essential for network resilience — it means local traffic can be served locally. International presence indicates operators are globally connected, but over-reliance on foreign infrastructure is a resilience risk.
      
      {% else %}
      No physical infrastructure data available for this country.
      {% endif %}
    
    fields:
      Country:
        type: "string"
        label: "Country Name"
      DomesticFacilities:
        type: "integer"
        label: "Domestic Facilities"
      InternationalFacilities:
        type: "integer"
        label: "International Facilities"
      TotalFacilities:
        type: "integer"
        label: "Total Facilities"

  "3.cypher":
    description: "IXP connectivity gap — active ASes connected to a domestic IXP vs those that are not"
    
    template: |
      Title: IXP Connectivity Gap Analysis in {{ params.countryCode | upper }}
      
      This analysis identifies how many active network operators are members of at least one domestic IXP versus those with no local IXP presence. ASes not connected to any domestic IXP must route all traffic via upstream transit providers, increasing costs and latency while reducing resilience.
      
      {% if results %}
      **IXP Connectivity Overview:**
      
      - Country: **{{ results[0].Country }}**
      - Active ASes connected to a domestic IXP: **{{ results[0].IXPConnected }}**
      - Active ASes NOT connected to any domestic IXP: **{{ results[0].NotIXPConnected }}**
      - Total Active ASes: **{{ results[0].TotalActive }}**
      - IXP Adoption Rate: **{{ results[0].IXPAdoptionPercent }}%**
      
      **Interpretation:**
      
      Only **{{ results[0].IXPAdoptionPercent }}%** of active ASes are members of a domestic IXP. The remaining **{{ results[0].NotIXPConnected }}** operators must rely entirely on upstream transit for traffic exchange. Increasing IXP adoption is one of the most impactful policy actions for improving network coverage resilience — it enables local traffic to stay local.
      
      {% else %}
      No IXP connectivity data available for this country.
      {% endif %}
    
    fields:
      Country:
        type: "string"
        label: "Country Name"
      IXPConnected:
        type: "integer"
        label: "IXP Connected ASes"
      NotIXPConnected:
        type: "integer"
        label: "Non-IXP ASes"
      TotalActive:
        type: "integer"
        label: "Total Active ASes"
      IXPAdoptionPercent:
        type: "float"
        label: "IXP Adoption Rate"

  "4.cypher":
    description: "Peering density — domestic vs international peering connections"
    
    template: |
      Title: Network Peering Density in {{ params.countryCode | upper }}
      
      This analysis breaks down the country's peering relationships into domestic (both ASes in the same country) and international. High domestic peering density means local traffic can be exchanged locally; low domestic peering means traffic must route internationally — a critical resilience weakness.
      
      {% if results %}
      **Peering Density Overview:**
      
      - Country: **{{ results[0].Country }}**
      - Domestic Peers: **{{ results[0].DomesticPeers }}**
      - International Peers: **{{ results[0].InternationalPeers }}**
      - Total Peers: **{{ results[0].TotalPeers }}**
      
      **Interpretation:**
      
      **{{ results[0].DomesticPeers }}** domestic peers versus **{{ results[0].InternationalPeers }}** international peers. A healthy peering ecosystem has strong domestic interconnection so that local traffic doesn't need to leave the country. The ratio of domestic to international peering is a key indicator of network self-sufficiency and resilience.
      
      {% else %}
      No peering data available for this country.
      {% endif %}
    
    fields:
      Country:
        type: "string"
        label: "Country Name"
      DomesticPeers:
        type: "integer"
        label: "Domestic Peers"
      InternationalPeers:
        type: "integer"
        label: "International Peers"
      TotalPeers:
        type: "integer"
        label: "Total Peers"
