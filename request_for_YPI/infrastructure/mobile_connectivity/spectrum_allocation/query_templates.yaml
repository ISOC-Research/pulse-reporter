# ============================================================================
# Query Configuration - Spectrum Allocation
# Pillar: Infrastructure / Mobile Connectivity / Spectrum Allocation
# ============================================================================

queries:
  "1.cypher":
    description: "BGP prefix breakdown by address family — IP address space utilization with IPv4/IPv6 split"
    
    template: |
      Title: IP Address Space Utilization in {{ params.countryCode | upper }}
      
      This analysis measures the total BGP prefix footprint of the country's network operators, broken down by address family (IPv4 vs IPv6). In the IYP graph, this serves as the best available proxy for network capacity and address space allocation — a structural correlate of spectrum/address utilization maturity.
      
      {% if results %}
      **Analysis Results:**
      
      - Country: **{{ results[0].Country }}**
      - Total BGP prefixes originated: **{{ results[0].Originated_Prefixes }}**
      - IPv4 prefixes: **{{ results[0].IPv4_Prefixes }}**
      - IPv6 prefixes: **{{ results[0].IPv6_Prefixes }}**
      - Active operators: **{{ results[0].ActiveOperators }}**
      - IPv6 share of prefix table: **{{ results[0].IPv6_SharePercent }}%**
      
      **Interpretation:**
      
      A higher total prefix count indicates greater IP address space allocation and more granular network segmentation. An increasing IPv6 share reflects modernization of the address space — operators planning for long-term scalability beyond IPv4 exhaustion.
      
      {% else %}
      No BGP prefix data available for this country.
      {% endif %}
    
    fields:
      Country:
        type: "string"
        label: "Country Name"
      Originated_Prefixes:
        type: "integer"
        label: "Total BGP Prefixes Originated"
      IPv4_Prefixes:
        type: "integer"
        label: "IPv4 Prefixes"
      IPv6_Prefixes:
        type: "integer"
        label: "IPv6 Prefixes"
      ActiveOperators:
        type: "integer"
        label: "Active Operators"
      IPv6_SharePercent:
        type: "float"
        label: "IPv6 Share (%)"
        format: "float_2"
    
    sort_by: "Originated_Prefixes"
    sort_order: "desc"

  "2.cypher":
    description: "Top ASes by total prefix count with IPv6 adoption status"
    
    template: |
      Title: Largest IP Address Space Holders in {{ params.countryCode | upper }}
      
      This analysis identifies the top 20 network operators in the country by number of BGP prefixes announced, broken down by IPv4 and IPv6, with an IPv6 adoption flag. Operators with zero IPv6 prefixes are not future-ready and represent resilience risks as IPv4 address space becomes increasingly scarce.
      
      {% if results %}
      **Top Operators by Address Space:**
      
      | ASN | Operator Name | Total Prefixes | IPv4 | IPv6 | IPv6 Adopted |
      |-----|---------------|----------------|------|------|--------------|
      {% for row in results %}
      | AS{{ row.ASN }} | {{ row.OperatorName if row.OperatorName else "(unnamed)" }} | {{ row.TotalPrefixes }} | {{ row.IPv4Prefixes }} | {{ row.IPv6Prefixes }} | {{ row.IPv6Adopted }} |
      {% endfor %}
      
      **Interpretation:**
      
      Operators with large address space allocations are the backbone of the country's internet capacity. The IPv6 Adopted column highlights which major operators have modernized — those showing "No" are critical targets for IPv6 adoption programs, as IPv4 exhaustion threatens long-term scalability and resilience.
      
      {% else %}
      No address space data available for this country.
      {% endif %}
    
    fields:
      ASN:
        type: "integer"
        label: "ASN"
      OperatorName:
        type: "string"
        label: "Operator Name"
      TotalPrefixes:
        type: "integer"
        label: "Total Prefixes"
      IPv4Prefixes:
        type: "integer"
        label: "IPv4 Prefixes"
      IPv6Prefixes:
        type: "integer"
        label: "IPv6 Prefixes"
      IPv6Adopted:
        type: "string"
        label: "IPv6 Adopted"
    
    sort_by: "TotalPrefixes"
    sort_order: "desc"
    limit: 20

