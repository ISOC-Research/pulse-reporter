# ============================================================================
# Query Configuration - Fiber 10km Reach
# Pillar: Infrastructure / Fiber Ecosystem / Fiber 10km Reach
# ============================================================================

queries:
  "1.cypher":
    description: "Geographic coverage points of active ASes — fiber infrastructure reach approximation"
    
    template: |
      Title: Fiber Infrastructure Geographic Reach in {{ params.countryCode | upper }}
      
      This analysis approximates the physical fiber reach of internet infrastructure by counting the number of distinct geographic Points associated with active Autonomous Systems (operators that actually announce BGP routes). More geographic points spread across more operators indicates a broader physical network footprint and suggests wider fiber deployment reach.
      
      {% if results %}
      **Analysis Results:**
      
      - Country: **{{ results[0].Country }}**
      - Geographic coverage points: **{{ results[0].GeoCoveragePoints }}**
      - Active network operators: **{{ results[0].ActiveOperators }}**
      
      **Interpretation:**
      
      **{{ results[0].GeoCoveragePoints }}** distinct geographic locations are registered by **{{ results[0].ActiveOperators }}** active network operators. A higher count indicates operators have declared infrastructure presence in more locations, which is a structural proxy for fiber or fixed network deployment breadth.
      
      {% else %}
      No geographic coverage data available for this country.
      {% endif %}
    
    fields:
      Country:
        type: "string"
        label: "Country Name"
      GeoCoveragePoints:
        type: "integer"
        label: "Geographic Coverage Points"
      ActiveOperators:
        type: "integer"
        label: "Active Network Operators"
    
    sort_by: "GeoCoveragePoints"
    sort_order: "desc"

  "2.cypher":
    description: "Top network operators by BGP prefix count and physical facility presence"
    
    template: |
      Title: Network Operators by Routing Footprint and Physical Presence in {{ params.countryCode | upper }}
      
      This analysis ranks the country's active network operators by the number of BGP prefixes they announce (routing footprint) combined with the number of data center facilities they are present in (physical footprint). Operators with both high prefix counts and broad facility presence have the deepest infrastructure reach.
      
      {% if results %}
      **Top Operators by Routing and Physical Footprint:**
      
      | ASN | Operator Name | BGP Prefixes | Facilities |
      |-----|---------------|--------------|------------|
      {% for row in results %}
      | AS{{ row.ASN }} | {{ row.OperatorName if row.OperatorName else "(unnamed)" }} | {{ row.AnnouncedPrefixes }} | {{ row.FacilityPresence }} |
      {% endfor %}
      
      **Interpretation:**
      
      Operators with many BGP prefixes but low facility presence may be using third-party infrastructure. Operators with both high prefix counts and multiple facilities have the strongest physical infrastructure footprint and are the backbone of the country's fiber ecosystem.
      
      {% else %}
      No BGP prefix data available for this country.
      {% endif %}
    
    fields:
      ASN:
        type: "integer"
        label: "ASN"
      OperatorName:
        type: "string"
        label: "Operator Name"
      AnnouncedPrefixes:
        type: "integer"
        label: "BGP Prefixes Announced"
      FacilityPresence:
        type: "integer"
        label: "Facilities Present In"
    
    sort_by: "AnnouncedPrefixes"
    sort_order: "desc"
    limit: 20

  "3.cypher":
    description: "Multi-facility operators — ASes present in more than one data center"
    
    template: |
      Title: Multi-Facility Network Operators in {{ params.countryCode | upper }}
      
      This analysis identifies network operators colocated in more than one data center facility within the country. An operator present across multiple facilities has physically distributed infrastructure — the strongest structural indicator of real geographic network reach and fiber deployment beyond a single site.
      
      {% if results %}
      **Multi-Facility Operators:**
      
      | ASN | Operator Name | Facilities |
      |-----|---------------|------------|
      {% for row in results %}
      | AS{{ row.ASN }} | {{ row.OperatorName if row.OperatorName else "(unnamed)" }} | {{ row.NumberOfFacilities }} |
      {% endfor %}
      
      **Interpretation:**
      
      Countries where many operators are present in multiple facilities have a more resilient, geographically dispersed fiber ecosystem. Operators appearing in only a single facility represent single-point-of-failure risks.
      
      {% else %}
      No multi-facility operator data available for this country. This may indicate that operators in this country have limited physical infrastructure diversity.
      {% endif %}
    
    fields:
      ASN:
        type: "integer"
        label: "ASN"
      OperatorName:
        type: "string"
        label: "Operator Name"
      NumberOfFacilities:
        type: "integer"
        label: "Number of Facilities"
    
    sort_by: "NumberOfFacilities"
    sort_order: "desc"

