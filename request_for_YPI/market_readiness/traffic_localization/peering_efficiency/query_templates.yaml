# ============================================================================
# Configuration des requêtes - Peering Efficiency
# Pilier: Market Readiness
# ============================================================================

queries:

  # ----------------------------------------------------------------------------
  # Query 1: Calculate the Core Peering Efficiency Ratio
  # ----------------------------------------------------------------------------
  "1.cypher":
    description: "Calculates the peering efficiency ratio (local ASes in local IXPs vs total local ASes)."
    
    template: |
      Title: Peering Efficiency Ratio for {{ params.countryCode | upper }}
      
      This metric measures the density of the local peering ecosystem. It calculates the ratio between the networks (ASes) participating in domestic IXPs and the total number of networks in the country. A high ratio (close to 100%) indicates a mature and resilient market, where local traffic is exchanged efficiently, reducing latency and dependence on international transit.
      
      {% if results %}
      **Analysis Results:**
      
      - Total number of ASes in the country: **{{ results[0].totalASNs|default(0) }}**
      - ASes participating in local peering: **{{ results[0].peeringASNs|default(0) }}**
      - Peering Efficiency Ratio: **{{ (results[0].peeringEfficiencyRatio * 100)|round(2) }}%**
      
      {% else %}
      Data not available to calculate the peering efficiency ratio for this country.
      {% endif %}
      
    fields:
      totalASNs:
        type: "integer"
        label: "Total Number of ASes"
        format: "number"
      peeringASNs:
        type: "integer"
        label: "Number of Peering ASes"
        format: "number"
      peeringEfficiencyRatio:
        type: "float"
        label: "Efficiency Ratio"
        format: "percentage"

  # ----------------------------------------------------------------------------
  # Query 2: List Domestic IXPs and their Peering Density
  # ----------------------------------------------------------------------------
  "2.cypher":
    description: "Lists domestic IXPs and their number of local AS members."
    
    template: |
      Title: Domestic IXP Density Ranking for {{ params.countryCode | upper }}
      
      This analysis identifies all domestic Internet Exchange Points (IXPs) and ranks them by the number of local AS members. This reveals which IXPs are the most critical for the country's peering ecosystem and whether this ecosystem is distributed (multiple IXPs) or centralized (a single dominant IXP).
      
      {% if results %}
      **Ranking of the {{ results|length }} identified IXP(s) by local member count:**
      
      {% for ixp in results %}
      - **Rank {{ loop.index }}:** {{ ixp.ixpName }} (ID: {{ ixp.ixpId }})
        Number of local members: **{{ ixp.localMemberCount }}**
      {% endfor %}
      
      {% if results|length > max_display %}
      _({{ results|length - max_display }} other IXP(s) in the complete ranking)_
      {% endif %}
      
      {% else %}
      No domestic IXP identified for this country.
      {% endif %}
      
    fields:
      ixpId:
        type: "integer"
        label: "IXP ID"
      ixpName:
        type: "string"
        label: "IXP Name"
      localMemberCount:
        type: "integer"
        label: "Local Members"
        format: "number"
    
    max_display: 15
    sort_by: "localMemberCount"
    sort_order: "desc"

  # ----------------------------------------------------------------------------
  # Query 3: Identify High-Impact ASNs Not Peering Domestically
  # ----------------------------------------------------------------------------
  "3.cypher":
    description: "Identifies high-impact local ASes (by customer cone size) that do not participate in domestic peering."
    
    template: |
      Title: High-Impact ASes Not Participating in Local Peering for {{ params.countryCode | upper }}
      
      This analysis identifies local networks (ASes) that are not members of any domestic IXP. They are ranked by their global importance (via CAIDA ASRank, where a lower number means a bigger network) to reveal which missing players have the biggest impact on domestic peering efficiency. Incentivizing these players to join local IXPs is a key action to improve resilience.
      
      {% if results %}
      **Ranking of major non-participating ASes (by Global Rank):**
      
      {% for as in results %}
      - **Rank {{ loop.index }}:** {{ as.asName|default('Unknown Name') }} (AS{{ as.asn }})
        Global Rank (ASRank): **{{ as.caidaRank|default('Unknown') }}**
      {% endfor %}
      
      {% if results|length > max_display %}
      _({{ results|length - max_display }} other non-participating AS(es) identified)_
      {% endif %}
      
      {% else %}
      Excellent news: All identified ASes in this country appear to participate in at least one local IXP, or no ASes with rank data were found.
      {% endif %}
      
    fields:
      asn:
        type: "integer"
        label: "ASN"
      asName:
        type: "string"
        label: "AS Name"
      caidaRank:
        type: "integer"
        label: "Global Rank (ASRank)"
        format: "number"
    
    max_display: 20
    sort_by: "caidaRank"
    sort_order: "asc"

  # ----------------------------------------------------------------------------
  # Query 4: IXP Membership Depth Distribution
  # ----------------------------------------------------------------------------
  "4.cypher":
    description: "Distribution of IXP membership depth — how many IXPs each local AS belongs to."
    
    template: |
      Title: IXP Membership Depth Distribution for {{ params.countryCode | upper }}
      
      This analysis shows how many local Autonomous Systems participate in multiple Internet Exchange Points simultaneously. ASes peering at more IXPs have greater redundancy and resilience. A country where many ASes join only one IXP has a more fragile peering ecosystem than one where ASes routinely multi-home across several IXPs.
      
      {% if results %}
      **IXP Membership Depth:**
      
      | IXPs Joined | Number of ASes |
      |-------------|----------------|
      {% for row in results %}
      | {{ row.numberOfIXPsMemberOf }} | {{ row.numberOfASes }} |
      {% endfor %}
      
      **Interpretation:**
      
      Rows with `numberOfIXPsMemberOf > 1` represent ASes with redundant IXP presence — a sign of a mature peering ecosystem. If most ASes appear only in the `1` row, the ecosystem is functional but not yet resilient against a single IXP outage.
      
      {% else %}
      No IXP membership depth data available for this country.
      {% endif %}
      
    fields:
      numberOfIXPsMemberOf:
        type: "integer"
        label: "Number of IXPs Joined"
        format: "number"
      numberOfASes:
        type: "integer"
        label: "Number of ASes"
        format: "number"
    
    sort_by: "numberOfIXPsMemberOf"
    sort_order: "desc"